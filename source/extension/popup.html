<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="capture.css"></head><body>
<header class="app-header"><div class="brand"><img src="icon-48.png" width="28" height="28" alt=""><div><h1>灵感采集</h1><small id="version">正在核验后台</small></div></div><div class="header-actions"><select id="ui-language" aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select><button id="manage" class="icon-button" aria-label="设置 / Settings" title="设置 / Settings"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button></div></header>
<section class="status-card"><button id="task-details" class="text-button">任务详情</button><div id="result-context" class="hint" hidden></div><div id="status" role="status">等待开始</div><progress id="progress" max="100" value="0" hidden></progress></section>
<main id="scroll-content"><fieldset id="task-options" disabled>
<section id="main-options">
<div class="intent-switch" role="group" aria-label="Capture scope / 采集范围"><button type="button" id="scope-current" aria-pressed="true">当前作品</button><button type="button" id="scope-bulk" aria-pressed="false">批量采集</button></div>
<select id="scope" hidden aria-label="采集范围"><option value="current">当前作品</option><option value="bulk">批量采集</option></select>
<label class="field"><span>采集内容</span><select id="collection-mode"><option value="images">图片</option><option value="text">图文笔记</option><option value="plain">纯文字 · Markdown</option><option value="video">视频</option></select></label>
<div class="field" id="video-tools" hidden><span>视频处理</span><div class="video-choices" role="group" aria-label="Video action / 视频操作"><button type="button" id="save-video" aria-pressed="true">仅保存</button><button type="button" id="download-frames" aria-pressed="false">保存并抽帧</button></div></div>
<label class="field" id="limit-row" hidden><span id="limit-label">本次最多处理</span><input id="batch-limit" aria-label="Limit / 数量" type="number" min="1" max="500" value="20"></label>
<p id="mode-help" class="hint"></p><p id="quota-help" class="hint" hidden>按视频计数；图片帖跳过。重复和失败的视频占额度；最多扫描500篇。</p>
<div id="text-options" class="quick-checks"><label id="images-option"><input id="include-images" type="checkbox">正文图片</label><label><input id="include-comments" type="checkbox">评论</label><label><input id="ocr-enabled" type="checkbox">图片文字识别</label><label id="plain-comments-option" hidden><input id="plain-comments" type="checkbox">附带已加载评论</label></div>
<label class="field" id="attachment-row"><span>附带视频</span><select id="video-action"><option value="skip">跳过视频</option><option value="save">仅保存视频</option><option value="frames">保存视频并抽帧</option></select></label>
<label class="field"><span>重复处理</span><select id="duplicate-policy"><option value="fill">自动去重补齐</option><option value="refresh">重新读取原帖</option></select></label>
<button type="button" id="more-options" class="text-button"><span>抽帧参数</span><small id="options-summary" hidden></small></button>
<section class="save-card"><div class="destination-row"><div><h2>本次保存到</h2><small id="destination-label">使用默认目录</small><p id="save-path" data-user-content></p></div><button type="button" id="choose-folder">选择…</button></div><div class="path-actions"><button type="button" id="open-path" class="text-button">打开文件夹</button><button type="button" id="default-path" class="text-button" hidden>恢复默认位置</button></div><p class="hint">选择其他位置仅影响本次，不改变素材库。</p></section>
<button type="button" id="collect-video" class="text-button" hidden>仅抽取当前视频画面</button></section>
<section id="secondary-options" hidden><div class="subheading"><h2>抽帧参数</h2></div><p class="hint">普通选择自动沿用；临时目录只用于本次。</p>
<p id="duplicate-help" class="hint"></p>
<div id="frame-options"><label class="field"><span>抽帧方式</span><select id="video-strategy"><option value="slides">分段图文 · 合并相近画面</option><option value="interval">普通视频 · 定时取图</option></select></label><label class="field"><span>采样间隔（秒）</span><input id="video-interval" type="number" min="0.5" max="60" step="0.5"></label></div>
<button type="button" id="restore-defaults">恢复设置页默认值</button></section></fieldset>
</main>
<dialog id="task-dialog"><section id="recovery" hidden><label id="resume-row"><input id="resume-task" type="checkbox">继续上次未完成任务（沿用原设置）</label><p id="resume-help" class="hint" hidden>续采使用原任务参数；取消续采后才能修改。</p><button id="end-task">结束这次任务</button></section>
<details id="result-details"><summary>结果详情</summary><pre id="diagnostic-text"></pre></details><button id="close-task">关闭</button></dialog>
<footer class="start-bar"><div id="approval" hidden><p id="approval-text"></p><div class="inline-actions"><button id="approve" class="primary">确认下载</button><button id="reject">取消任务</button></div></div><div id="controls" hidden><button id="pause">暂停</button><button id="stop">停止</button></div><button id="reset" class="text-button" hidden>卡住时停止并重置</button><p id="summary" class="hint" aria-live="polite"></p><button id="start" class="primary" disabled>▶ 开始采集</button></footer>
<dialog id="folder-dialog"><h2>仅本次另存</h2><p id="folder-status" role="status">正在打开系统目录窗口…</p><p class="hint">所选位置下仍按功能和平台分类。留空使用默认素材库。</p><label>路径<input id="task-destination" placeholder="留空使用默认目录"></label><div class="inline-actions"><button type="button" id="choose-folder-more">选择系统文件夹</button></div><div class="inline-actions"><button id="folder-cancel">取消</button><button id="folder-apply" class="primary">使用此目录</button></div></dialog>
<script src="site-panel.js"></script><script src="hub-api.js"></script><script src="i18n.js"></script><script src="rounded-select.js"></script><script src="popup.js"></script></body></html>

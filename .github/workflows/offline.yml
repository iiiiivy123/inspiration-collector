name: Offline regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned service dependencies
        run: python -m pip install -r source/server/requirements.txt
      - name: Offline distribution and download checks
        run: python -m unittest discover -s tests/public -v
      - name: Connection guidance and JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem tests/public -Filter *.cjs | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Get-ChildItem source/extension -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
